[project]
name = "technology-digest"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["boto3>=1.40,<2", "defusedxml>=0.7.1,<1"]
[dependency-groups]
dev = ["pytest>=8,<10", "moto[dynamodb,s3,ses]>=5,<6", "ruff>=0.12"]
[tool.pytest.ini_options]
pythonpath = ["."]
[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
